<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avi AI 🚀 - Public AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f2937;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            border-bottom: 1px solid #374151;
            text-align: center;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #1f2937;
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #1f2937;
            border-top: 1px solid #374151;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #111827;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #60a5fa;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>Avi AI 🚀 - Public Assistant</header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">Vanakkam! Naan ungaloda public AI "Avi". Enkitta enna doubt venumalum kelungal! 👋</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Avi anything..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Ungaloda API key-ah inga potrukkonga
        const API_KEY = "AQ.Ab8RN6LhThAFDSxuvs9Uz_hYHcVwf7Wo0k_ol7S4luWa8VYTwQ";

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            if(sender === 'user') {
                msgDiv.classList.add('user-message');
            } else {
                msgDiv.classList.add('ai-message');
            }
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            const lowerText = text.toLowerCase();
            appendMessage(text, 'user');
            userInput.value = '';

            // Creator identity logic (Public AI standard)
            if(lowerText.includes('builder') || lowerText.includes('creator') || lowerText.includes('yaruda') || lowerText.includes('yar unga') || lowerText.includes('who built') || lowerText.includes('yaaru ungalai')) {
                setTimeout(() => {
                    appendMessage("Enai uruvaakkiyavar (creator) namma Lokey thaan! Avar thaan ennaku uyir koduthu intha public AI-ah design pannirukkaru! 🚀", 'ai');
                }, 300);
                return;
            }

            const loadingId = 'loading_' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'ai-message');
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "Avi is thinking...";
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {


                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'ai');
                } else if (data.error) {
                    appendMessage("API Error: " + data.error.message, 'ai');
                } else {
                    appendMessage("Oops! Received an empty response from AI.", 'ai');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Network error! Please check your internet connection.", 'ai');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
